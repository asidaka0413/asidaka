<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>テスト LAB - オーダーメイド衣装 & チャット</title>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-color: #0d0f14;
      --card-bg: #161922;
      --accent-color: #00f2fe;
      --accent-purple: #4facfe;
      --text-main: #ffffff;
      --text-sub: #9ca3af;
      --border-color: #272c3d;
      --input-bg: #0f1118;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; }

    /* ヘッダー */
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 1rem 5%; border-bottom: 1px solid var(--border-color);
      background: rgba(13, 15, 20, 0.9); backdrop-filter: blur(10px);
      position: sticky; top: 0; z-index: 100;
    }
    .logo { font-size: 1.4rem; font-weight: bold; background: linear-gradient(45deg, var(--accent-color), var(--accent-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    /* Xログインボタン & ユーザーUI */
    .btn-x-login {
      background: #000; color: #fff; border: 1px solid var(--border-color);
      padding: 0.5rem 1.2rem; border-radius: 20px; cursor: pointer; font-weight: bold;
      display: flex; align-items: center; gap: 8px; transition: 0.3s;
    }
    .btn-x-login:hover { border-color: var(--accent-color); }

    .user-profile { display: flex; align-items: center; gap: 10px; }
    .user-avatar { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--accent-color); }
    .btn-logout { background: transparent; border: 1px solid var(--border-color); color: var(--text-sub); padding: 0.4rem 0.8rem; border-radius: 12px; cursor: pointer; font-size: 0.8rem; }
    .btn-logout:hover { color: #fff; border-color: #ff4d4d; }

    /* メインコンテンツ */
    .container { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }

    /* リアルタイムチャットUI */
    .chat-card {
      background: var(--card-bg); border: 1px solid var(--border-color);
      border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; height: 500px;
    }
    .chat-header {
      padding: 1rem 1.5rem; background: #11131a; border-bottom: 1px solid var(--border-color);
      display: flex; justify-content: space-between; align-items: center;
    }
    .chat-messages {
      flex: 1; padding: 1.5rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem;
    }

    /* 吹出しデザイン */
    .msg-group { display: flex; gap: 10px; max-width: 80%; }
    .msg-group.self { align-self: flex-end; flex-direction: row-reverse; }
    .msg-group.other { align-self: flex-start; }
    .msg-avatar { width: 32px; height: 32px; border-radius: 50%; }
    .msg-body { display: flex; flex-direction: column; }
    .msg-author { font-size: 0.75rem; color: var(--text-sub); margin-bottom: 2px; }
    .msg-group.self .msg-author { text-align: right; }
    .msg-bubble { padding: 0.8rem 1.2rem; border-radius: 14px; font-size: 0.95rem; word-break: break-all; }
    .msg-group.self .msg-bubble { background: linear-gradient(135deg, #0055ff, #00aafe); color: #fff; }
    .msg-group.other .msg-bubble { background: var(--border-color); color: #fff; }

    /* 入力エリア */
    .chat-input-area { padding: 1rem; border-top: 1px solid var(--border-color); display: flex; gap: 10px; background: #11131a; }
    .chat-input-area input { flex: 1; background: var(--input-bg); border: 1px solid var(--border-color); padding: 0.8rem 1rem; border-radius: 8px; color: #fff; outline: none; }
    .chat-input-area input:focus { border-color: var(--accent-color); }
    .btn-send { background: linear-gradient(45deg, var(--accent-color), var(--accent-purple)); border: none; padding: 0 1.5rem; border-radius: 8px; font-weight: bold; cursor: pointer; color: #000; }
    
    /* 未ログインオーバーレイ */
    .login-overlay {
      position: absolute; inset: 0; background: rgba(13, 15, 20, 0.85);
      backdrop-filter: blur(4px); display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 1rem; z-index: 10;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">VRC-OUTFIT LAB</div>
    <div id="auth-area">
      <!-- JSでログイン/ログアウトボタンを切り替えます -->
    </div>
  </header>

  <main class="container">
    <h2 style="margin-bottom: 1rem; text-align: center;">オーダー相談リアルタイムチャット</h2>

    <div class="chat-card" style="position: relative;">
      
      <!-- 未ログイン時に表示されるオーバーレイ -->
      <div id="login-overlay" class="login-overlay">
        <p>チャットを利用するにはX（旧Twitter）ログインが必要です</p>
        <button class="btn-x-login" onclick="loginWithX()">
          <span>𝕏</span> Xでログインして始める
        </button>
      </div>

      <div class="chat-header">
        <span>オーダー相談ルーム</span>
        <span style="color: var(--accent-color); font-size: 0.85rem;">● リアルタイム同期中</span>
      </div>

      <!-- メッセージ表示エリア -->
      <div id="chat-messages" class="chat-messages">
        <!-- JSでここにログが読み込まれます -->
      </div>

      <!-- 入力欄 -->
      <form class="chat-input-area" onsubmit="sendMessage(event)">
        <input type="text" id="msg-input" placeholder="メッセージを入力..." required autocomplete="off">
        <button type="submit" class="btn-send">送信</button>
      </form>

    </div>
  </main>

  <script>
    // -------------------------------------------------------------
    // 1. Supabase初期化（※ご自身のURLとAnon Keyに置き換えてください）
    // -------------------------------------------------------------
    const SUPABASE_URL = 'https://wpstfkjqtsutrdiuzudz.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indwc3Rma2pxdHN1dHJkaXV6dWR6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMDI1NDMsImV4cCI6MjEwMjY3ODU0M30.iZhtAsFDWEkcEL6tKzb1rXwgy1UOChSRdTNRzOcIMDo';
    
    window supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;

    // -------------------------------------------------------------
    // 2. 認証処理（Xログイン・ログアウト）
    // -------------------------------------------------------------
    async function loginWithX() {
      const { error } = await supabase.auth.signInWithOAuth({
        provider: 'twitter',
        options: { redirectTo: window.location.origin }
      });
      if (error) alert('ログインエラー: ' + error.message);
    }

    async function logout() {
      await supabase.auth.signOut();
      window.location.reload();
    }

    // ログイン状態の監視
    supabase.auth.onAuthStateChange((event, session) => {
      if (session && session.user) {
        currentUser = session.user;
        renderLoggedInUI(currentUser);
        document.getElementById('login-overlay').style.display = 'none';
        loadMessages(); // 過去ログ取得
        subscribeRealtime(); // リアルタイム受信の開始
      } else {
        currentUser = null;
        renderLoggedOutUI();
        document.getElementById('login-overlay').style.display = 'flex';
      }
    });

    function renderLoggedInUI(user) {
      const name = user.user_metadata?.full_name || user.user_metadata?.name || 'ユーザー';
      const avatar = user.user_metadata?.avatar_url || 'https://via.placeholder.com/36';
      document.getElementById('auth-area').innerHTML = `
        <div class="user-profile">
          <img src="${avatar}" class="user-avatar" alt="avatar">
          <span style="font-weight:bold; font-size:0.9rem;">${name}</span>
          <button class="btn-logout" onclick="logout()">ログアウト</button>
        </div>
      `;
    }

    function renderLoggedOutUI() {
      document.getElementById('auth-area').innerHTML = `
        <button class="btn-x-login" onclick="loginWithX()">
          <span>𝕏</span> Xでログイン
        </button>
      `;
    }

    // -------------------------------------------------------------
    // 3. チャット機能（データ取得・送信・リアルタイム同期）
    // -------------------------------------------------------------
    // 過去ログの読み込み
    async function loadMessages() {
      const { data, error } = await supabase
        .from('messages')
        .select('*')
        .order('created_at', { ascending: true });

      if (error) {
        console.error('メッセージ取得失敗:', error);
        return;
      }

      const container = document.getElementById('chat-messages');
      container.innerHTML = '';
      data.forEach(msg => appendMessageUI(msg));
      scrollToBottom();
    }

    // メッセージの送信
    async function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      if (!text || !currentUser) return;

      input.value = '';

      const { error } = await supabase.from('messages').insert([
        {
          content: text,
          user_name: currentUser.user_metadata?.full_name || currentUser.user_metadata?.name || 'VRCユーザー',
          avatar_url: currentUser.user_metadata?.avatar_url || 'https://via.placeholder.com/36',
          user_id: currentUser.id
        }
      ]);

      if (error) alert('送信失敗: ' + error.message);
    }

    // 画面にメッセージを描画する処理
    function appendMessageUI(msg) {
      const container = document.getElementById('chat-messages');
      const isSelf = currentUser && msg.user_id === currentUser.id;

      const groupDiv = document.createElement('div');
      groupDiv.className = `msg-group ${isSelf ? 'self' : 'other'}`;

      groupDiv.innerHTML = `
        <img src="${msg.avatar_url}" class="msg-avatar" alt="avatar">
        <div class="msg-body">
          <span class="msg-author">${msg.user_name}</span>
          <div class="msg-bubble">${escapeHtml(msg.content)}</div>
        </div>
      `;

      container.appendChild(groupDiv);
      scrollToBottom();
    }

    // Supabase Realtimeで新着メッセージを検知
    function subscribeRealtime() {
      supabase
        .channel('public:messages')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
          appendMessageUI(payload.new);
        })
        .subscribe();
    }

    function scrollToBottom() {
      const container = document.getElementById('chat-messages');
      container.scrollTop = container.scrollHeight;
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
    }
  </script>
</body>
</html>
